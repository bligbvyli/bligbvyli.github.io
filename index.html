<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>AI 健康監測平台</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
</head>
<body>
  <div class="navbar">
    <button class="tab-btn" data-tab="about">關於</button>
    <button class="tab-btn" data-tab="monitor">監控</button>
    <button class="tab-btn" data-tab="ai">AI 分析</button>
  </div>

  <!-- 關於 -->
  <div class="window active" id="about">
    <h2>關於本系統</h2>
    <div class="about-photo">
      <img src="https://i.imgur.com/A6zXwWc.jpg" alt="AI Logo" />
    </div>
    <p>這是一個結合 AI、ESP32-CAM 與藍牙感測器的智慧健康平台。</p>
  </div>

  <!-- 監控 -->
  <div class="window" id="monitor">
    <h2>鏡頭影像串流</h2>
    <div class="monitor-box">
      <img id="esp32-stream" src="" alt="Camera Stream" />
    </div>
    <div id="cam-status">尚未啟動串流</div>

    <h2 style="margin-top:40px;">藍牙燈控 (HM-10)</h2>
    <button id="ble-connect">🔗 連線 HM-10</button>
    <button id="light-on">💡 開燈</button>
    <button id="light-off">🌑 關燈</button>
    <div id="ble-status"></div>

    <h2 style="margin-top:40px;">藍牙血壓計</h2>
    <button id="bp-connect">🩺 連線血壓計</button>
    <div id="bp-status"></div>
    <div id="bp-data">
      <p>收縮壓 (SYS): <span id="sys">-</span></p>
      <p>舒張壓 (DIA): <span id="dia">-</span></p>
      <p>心跳 (HR): <span id="hr">-</span></p>
    </div>
  </div>

  <!-- AI 分析 -->
  <div class="window" id="ai">
    <h2>AI 血壓分析系統</h2>
    <button id="train-btn">🧠 建立健康模型</button>
    <div id="train-status" style="margin:10px 0; font-weight:bold;"></div>

    <h3>輸入血壓數值</h3>
    <input type="number" id="input-sys" placeholder="收縮壓 SYS" />
    <input type="number" id="input-dia" placeholder="舒張壓 DIA" />
    <button id="predict-btn" disabled>🔍 分析健康風險</button>

    <h4>快速測試</h4>
    <button class="test-preset" data-sys="115" data-dia="72">🟢 115/72</button>
    <button class="test-preset" data-sys="135" data-dia="90">🟠 135/90</button>
    <button class="test-preset" data-sys="160" data-dia="100">🔴 160/100</button>

    <div id="result-area" style="display:none; margin-top:20px;">
      <p>風險分數：<span id="risk-score"></span></p>
      <p id="health-advice"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
