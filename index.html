<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>遠端監控與控制系統</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="navbar">
    <button class="tab-btn" data-tab="about">關於我</button>
    <button class="tab-btn" data-tab="control">遠端控制</button>
    <button class="tab-btn" data-tab="monitor">遠端監控</button>
    <button class="tab-btn" data-tab="health">健康監測</button>
  </div>

  <div class="window active" id="about">
    <h2>👤 關於我</h2>
    <p>這是我的網站，整合了遠端控制、影像監控與血壓健康檢測。</p>
  </div>

  <div class="window" id="control">
    <h2>💡 遠端控制</h2>
    <button id="ble-connect">🔗 連線 HM-10</button>
    <button id="light-on">💡 開燈</button>
    <button id="light-off">🌑 關燈</button>
    <p id="ble-status">尚未連線</p>
  </div>

  <div class="window" id="monitor">
    <h2>📷 遠端監控</h2>
    <p>請確認 ESP32-CAM 已啟動。</p>
    <img id="esp32-stream" src="" alt="點擊下方按鈕開始串流"/>
    <p id="cam-status">尚未開始串流</p>
    <button onclick="startCameraStream()">開始影像串流</button>
  </div>

  <div class="window" id="health">
    <h2>🩺 血壓分析</h2>
    <p>請輸入您的血壓數值進行分析：</p>
    <input id="input-sys" type="number" placeholder="收縮壓 (SYS)">
    <input id="input-dia" type="number" placeholder="舒張壓 (DIA)">
    <button id="train-btn">🧠 訓練模型</button>
    <button id="predict-btn" disabled>🔍 分析</button>
    <p id="train-status">尚未訓練模型</p>
    <div id="result-area" style="display:none; margin-top:15px;">
      <p>風險評估分數：<span id="risk-score"></span></p>
      <p id="health-advice"></p>
    </div>
  </div>
</body>
</html>
