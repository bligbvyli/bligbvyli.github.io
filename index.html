
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>血壓風險即時分析</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>血壓健康評估系統</h2>
    <label>收縮壓 SYS: <input id="input-sys" type="number"></label><br>
    <label>舒張壓 DIA: <input id="input-dia" type="number"></label><br>
    <label>脈搏 Pulse: <input id="input-pulse" type="number"></label><br>
    <button id="predict-btn">分析健康狀況</button>

    <div id="result-area" style="display:none; margin-top: 20px;">
      <p>風險分數：<span id="risk-score"></span></p>
      <p id="health-advice"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
